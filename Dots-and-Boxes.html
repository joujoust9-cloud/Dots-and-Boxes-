<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Dots and Boxes</title>
<style>
/* Layout: graph-paper notebook. One screen at a time: menu, setup, game, how to play, settings.
   Motion: pen-stroke line draw, box pop, screen rise, confetti on win. */
:root {
  color-scheme: light dark;
  --paper: #f2f5fc;
  --grid: #d5ddf0;
  --card: #fbfcff;
  --ink: #1b2559;
  --muted: #5d6796;
  --line: #c3cde8;
  --pen0: #1d3fd1;
  --pen1: #d12a2a;
  --pen2: #1c8a4a;
  --pen3: #c77a00;
  --good: #1f7a4d;
  --shade: rgba(20, 28, 60, 0.45);
  --font-display: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131828; --grid: #1f2740; --card: #181e33; --ink: #e3e8ff; --muted: #9aa5d6;
    --line: #2c3659; --pen0: #7b95ff; --pen1: #ff7f7f; --pen2: #62d19a; --pen3: #ffbf5e;
    --good: #62d19a; --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  --paper: #131828; --grid: #1f2740; --card: #181e33; --ink: #e3e8ff; --muted: #9aa5d6;
  --line: #2c3659; --pen0: #7b95ff; --pen1: #ff7f7f; --pen2: #62d19a; --pen3: #ffbf5e;
  --good: #62d19a; --shade: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[lang="ar"] { --font-display: var(--font-body); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
  padding-top: max(18px, env(safe-area-inset-top, 0px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.screen.enter { animation: rise 0.28s ease-out backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1.05; margin: 0; }
:root[lang="ar"] h1, :root[lang="ar"] h2 { font-weight: 800; }
.sub { margin: 0; color: var(--muted); font-size: 0.95rem; }
.lbl { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0; }
:root[lang="ar"] .lbl { letter-spacing: 0; text-transform: none; font-size: 0.85rem; }

button {
  font: 700 1rem var(--font-body); min-height: 50px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--card); color: var(--ink); padding: 0 14px;
  transition: transform 0.08s ease, background-color 0.15s ease, color 0.15s ease;
}
button:active:not(:disabled) { transform: scale(0.97); }
/* press feedback: pop + ripple on tap, pop when a toggle becomes selected */
button { position: relative; overflow: hidden; }
button[aria-pressed="true"] { animation: selPop 0.32s ease-out; }
button.tap { animation: tapPop 0.32s ease-out; }
@keyframes tapPop { 0% { transform: scale(1); } 35% { transform: scale(0.92); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes selPop { 0% { transform: scale(1); } 35% { transform: scale(0.92); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.3; transform: scale(0); pointer-events: none; animation: ripple 0.5s ease-out forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
button.primary, button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-width: 0; }

/* menu */
.menu { align-items: center; text-align: center; gap: 16px; padding-top: 6px; }
.menu.enter > * { animation: rise 0.45s ease-out both; }
.menu.enter > :nth-child(2) { animation-delay: 0.05s; }
.menu.enter > :nth-child(3) { animation-delay: 0.1s; }
.menu.enter > :nth-child(4) { animation-delay: 0.16s; }
.menu.enter > :nth-child(5) { animation-delay: 0.22s; }
.logo { width: 72px; height: 72px; }
.menu { position: relative; }
.menu .logo { width: 88px; height: 88px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 14px 28px -16px rgba(20, 28, 60, 0.5); }
.menu h1 { font-family: var(--font-body); font-weight: 800; font-size: 2.3rem; letter-spacing: -0.03em; }
.menu .sub { max-width: 300px; }
.menu .iconbtn, #s-setup .iconbtn, #s-settings .iconbtn { background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 14px -8px rgba(20, 28, 60, 0.5); }
.iconbtn { position: absolute; top: 0; width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; line-height: 1; }
.iconbtn.start { inset-inline-start: 0; }
.iconbtn.next { inset-inline-start: 52px; }
#again, #replay, #share { display: grid; place-items: center; }
#again svg, #replay svg, #share svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tbar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; }
.controls.over { grid-template-columns: 1fr 1fr 1fr; }
button.danger { background: #d32f2f; border-color: #d32f2f; color: #fff; }
.savelist { display: flex; flex-direction: column; gap: 14px; }
.save .names-line { margin: 0; font-weight: 700; }
.memwrap { position: absolute; top: 0; inset-inline-end: 0; width: 44px; height: 44px; }
.memwrap .iconbtn { position: static; }
.badge { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 12px; background: var(--pen1); color: var(--paper); font: 800 0.75rem/18px var(--font-body); text-align: center; border: 2px solid var(--paper); box-sizing: content-box; pointer-events: none; }
.iconbtn.backbtn { position: static; align-self: flex-start; }
:root[dir="rtl"] .backbtn svg { transform: scaleX(-1); }
.iconbtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.menu .preview { width: min(100%, 300px); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: 0 14px 28px -18px rgba(20, 28, 60, 0.5); }
.menu .btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.menu .btns button { min-height: 60px; font-size: 1.15rem; border-radius: 18px; box-shadow: 0 14px 24px -14px var(--ink); }
.menu .btns button::before, #s-setup > [data-act="start"]::before { content: "\25B6\FE0E"; font-size: 0.8em; margin-inline-end: 10px; }
:root[dir="rtl"] .menu .btns button::before, :root[dir="rtl"] #s-setup > [data-act="start"]::before { content: "\25C0\FE0E"; }

/* panels */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card .sub { font-size: 0.85rem; }

/* settings: grouped list, switches, sticky app bar */
.shead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; background: var(--paper); padding-block: 6px; box-shadow: 0 8px 8px -8px var(--line); }
.shead h2 { font-size: 1.9rem; }
.group { display: flex; flex-direction: column; gap: 8px; }
.gh { margin: 0; padding-inline: 4px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
:root[lang="ar"] .gh { letter-spacing: 0; text-transform: none; font-size: 0.85rem; }
.card.list { padding: 0; gap: 0; }
.list .item { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.list .item + .item { border-top: 1px solid var(--line); }
.list .item.row { flex-direction: row; align-items: center; justify-content: space-between; gap: 14px; }
.il { margin: 0; font-weight: 700; font-size: 1rem; }
.item .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
button.sw { flex: none; width: 52px; height: 30px; min-height: 0; padding: 0; border-radius: 16px; background: var(--card); border: 2px solid var(--ink); }
button.sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: transform 0.18s ease, background-color 0.18s ease; }
button.sw[aria-checked="true"] { background: var(--ink); }
button.sw[aria-checked="true"]::after { background: var(--paper); transform: translateX(22px); }
:root[dir="rtl"] button.sw[aria-checked="true"]::after { transform: translateX(-22px); }
.names { display: grid; gap: 10px; }
.names .row { min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px; background: var(--paper); border: 1px solid var(--line); border-inline-start: 4px solid var(--pen); border-radius: 16px; }
.names .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--paper); background: var(--pen); }
.names .fld { flex: 1; min-width: 110px; display: flex; flex-direction: column; gap: 3px; }
.names input { font: 700 1rem var(--font-body); color: var(--ink); background: var(--card); width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.names input:focus { border-color: var(--pen); }
.names .row[data-p="0"] { --pen: var(--pen0); } .names .row[data-p="1"] { --pen: var(--pen1); }
.names .row[data-p="2"] { --pen: var(--pen2); } .names .row[data-p="3"] { --pen: var(--pen3); }
.names .row label { color: var(--pen); font-weight: 700; font-size: 0.72rem; }
.names .kind { display: flex; gap: 3px; padding: 3px; background: var(--grid); border-radius: 12px; margin-inline-start: auto; }
.names .kind button { min-height: 36px; min-width: 40px; padding: 0; display: grid; place-items: center; border: 0; background: transparent; border-radius: 9px; }
.names .kind svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.names .kind button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#s-setup .shead { box-shadow: none; }
#s-setup .shead .iconbtn { align-self: center; }
#s-setup .shead h2 { font-family: var(--font-body); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
#s-setup .card { border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 12px 24px -18px rgba(20, 28, 60, 0.5); }
#s-settings .shead { box-shadow: none; }
#s-settings .shead .iconbtn { align-self: center; }
#s-settings .shead h2 { font-family: var(--font-body); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
#s-settings .card { border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 12px 24px -18px rgba(20, 28, 60, 0.5); }
#s-settings .card.list { padding: 0; }
#s-settings .seg { background: var(--grid); padding: 4px; border-radius: 14px; gap: 4px; }
#s-settings .seg button { min-height: 46px; border: 0; background: transparent; border-radius: 10px; }
#s-settings .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: 0 3px 8px -2px rgba(20, 28, 60, 0.45); }
#s-settings .card.list { padding: 0; }
#s-setup .card.list { padding: 0; }
.iconbtn.gearbtn { position: static; margin-inline-start: auto; align-self: center; }
.optsum { padding-inline: 4px; text-align: center; }
.overlay.sheet-ov { align-items: flex-end; padding: 0; }
.sheet { width: 100%; max-width: 520px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; background: var(--paper); border-radius: 24px 24px 0 0; padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 30px -12px rgba(20, 28, 60, 0.45); }
.sheet h2 { font-family: var(--font-body); font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; }

/* WebView-safe options sheet: establish the off-screen state before revealing it,
   then animate using composited CSS transitions rather than keyframe animations. */
#optsBox.overlay {
  animation: none;
  opacity: 0;
  transition: opacity 220ms ease;
  will-change: opacity;
}
#optsBox .sheet {
  transform: translate3d(0, 102%, 0);
  transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
  backface-visibility: hidden;
}
#optsBox.options-open { opacity: 1; }
#optsBox.options-open .sheet { transform: translate3d(0, 0, 0); }
#optsBox.options-closing { opacity: 0; pointer-events: none; }
#optsBox.options-closing .sheet {
  transform: translate3d(0, 102%, 0);
  transition-timing-function: cubic-bezier(0.4, 0, 1, 1);
}
/* the options sheet now lives outside #s-setup, so it carries its own copy of those scoped styles */
#optsBox .card { border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 12px 24px -18px rgba(20, 28, 60, 0.5); }
#optsBox .card.list { padding: 0; }
#optsBox .seg { background: var(--grid); padding: 4px; border-radius: 14px; gap: 4px; }
#optsBox .seg button { min-height: 46px; border: 0; background: transparent; border-radius: 10px; }
#optsBox .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: 0 3px 8px -2px rgba(20, 28, 60, 0.45); }
#s-setup .group { gap: 10px; }
.note { padding-inline: 4px; }
#s-setup .seg { background: var(--grid); padding: 4px; border-radius: 14px; gap: 4px; }
#s-setup .seg button { min-height: 46px; border: 0; background: transparent; border-radius: 10px; }
#s-setup .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: 0 3px 8px -2px rgba(20, 28, 60, 0.45); }
#countSeg button { font-size: 1.25rem; }
#s-setup > [data-act="start"] { position: sticky; bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 4; min-height: 58px; border-radius: 18px; font-size: 1.15rem; box-shadow: 0 14px 24px -14px var(--ink); }
.rules { margin: 0; padding-inline-start: 1.3rem; display: flex; flex-direction: column; gap: 9px; }
.rules li { padding-inline-start: 4px; }

/* game */
.top { display: flex; align-items: center; gap: 12px; }
.top .iconbtn { flex: none; align-self: center; background: var(--card); border: 1px solid var(--line); }
.prog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.prog .pt { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width 0.4s ease; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scores[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.player { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; display: flex; align-items: center; gap: 10px; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease; }
.player .pc { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.player .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1rem; color: var(--paper); background: var(--pen); }
.scores.live .player:not(.active) { opacity: 0.72; }
.scores[data-n="3"] .player { padding: 8px; gap: 7px; }
.scores[data-n="3"] .av { display: none; }
.scores[data-n="3"] .player .nm { color: var(--pen); }
.scores[data-n="3"] .pts { font-size: 1.6rem; }
.scores[data-n="3"] .pts small { display: none; }
.player.active { border-color: var(--pen); box-shadow: 0 8px 18px -10px var(--pen), 0 0 0 1px var(--pen); transform: translateY(-2px); }
.player.active::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--pen); opacity: 0.09; pointer-events: none; }
.player.active::after { content: ""; position: absolute; top: 8px; inset-inline-end: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--pen); animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--pen); } 100% { box-shadow: 0 0 0 8px transparent; } }
.player.active .nm { color: var(--ink); }
.player[data-p="0"] { --pen: var(--pen0); } .player[data-p="1"] { --pen: var(--pen1); }
.player[data-p="2"] { --pen: var(--pen2); } .player[data-p="3"] { --pen: var(--pen3); }
.player .nm { font-weight: 700; font-size: 0.85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pts { font-family: var(--font-body); font-weight: 800; font-size: 1.9rem; line-height: 1.05; letter-spacing: -0.02em; color: var(--pen); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pts small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-inline-start: 4px; }
.pts b { display: inline-block; font-weight: inherit; }
.pts b.bump { animation: bump 0.45s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
.board-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; direction: ltr; box-shadow: 0 1px 0 var(--line), 0 14px 28px -16px rgba(20, 28, 60, 0.45); }
svg { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.p0 { --c: var(--pen0); } .p1 { --c: var(--pen1); } .p2 { --c: var(--pen2); } .p3 { --c: var(--pen3); }
.cellfill { fill: var(--c); opacity: 0.2; }
.mark { fill: var(--c); font-family: var(--font-body); font-weight: 800; font-size: 24px; text-anchor: middle; dominant-baseline: central; }
.cellfill.new, .mark.new { transform-box: fill-box; transform-origin: center; }
.cellfill.new { animation: popFill 0.4s 0.18s ease-out both; }
.mark.new { animation: popMark 0.45s 0.18s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
@keyframes popFill { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 0.2; } }
@keyframes popMark { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.edge { stroke: var(--c); stroke-width: 6; stroke-linecap: round; }
.edge.new { animation: draw 0.26s ease-out both; }
@keyframes draw { from { stroke-dasharray: 40; stroke-dashoffset: 40; } to { stroke-dasharray: 40; stroke-dashoffset: 0; } }
.ghost { stroke-width: 2.5; stroke: var(--line); stroke-dasharray: 0.1 7; stroke-linecap: round; }
.cand { stroke-width: 6; stroke-linecap: round; stroke-dasharray: 7 6; animation: dash 0.8s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -26; } }
.warn { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; rx: 5; animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.8; } }
.dot { fill: var(--ink); }
.status { margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; text-align: center; font-size: 0.98rem; }
.status::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tc, var(--muted)); }
.status.win { font-size: 1.15rem; font-weight: 800; line-height: 1.2; color: var(--good); border-color: var(--good); animation: rise 0.4s ease-out both; }
.status.win::before { display: none; }
:root[lang="ar"] .status.win { font-size: 1.1rem; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; }
.controls { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; position: sticky; bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 4; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 24px -14px rgba(20, 28, 60, 0.55); }
.controls button { border-radius: 14px; min-height: 52px; }
.controls button:not(.primary):not(:disabled) { border-color: var(--line); }
#confirm::before { content: "\2713"; margin-inline-end: 8px; }

/* results */

/* ---- pro: how-to, saves, leave sheet ---- */

.cnt { margin-inline-start: auto; min-width: 30px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 0.85rem; text-align: center; font-variant-numeric: tabular-nums; }
.howintro { padding-inline: 4px; font-size: 1rem; }

.hs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#s-how .card { border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; box-shadow: 0 12px 24px -18px rgba(20, 28, 60, 0.5); gap: 0; }
.rules { list-style: none; padding: 0; counter-reset: r; gap: 0; }
.rules li { counter-increment: r; display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; padding-inline-start: 0; }
.rules li + li { border-top: 1px solid var(--line); }
.rules li::before { content: counter(r); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--grid); color: var(--ink); font-weight: 800; font-size: 0.8rem; display: grid; place-items: center; margin-top: 1px; font-variant-numeric: tabular-nums; }
.savelist { gap: 12px; }
.save.card { padding: 14px; gap: 12px; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 12px 24px -18px rgba(20, 28, 60, 0.5); }
.svtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.svtop .sub { font-size: 0.8rem; }
.chip { font-size: 0.72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--grid); color: var(--ink); }
.svpl { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.svp { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-inline-start: 4px solid var(--pen); border-radius: 14px; }
.svp .av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: var(--paper); background: var(--pen); }
.svp span.t { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.svp .n { font-size: 0.75rem; color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svp .v { font-weight: 800; font-size: 1.15rem; color: var(--pen); font-variant-numeric: tabular-nums; }
.svprog { display: flex; flex-direction: column; gap: 6px; }
.svprog .pbar i { width: var(--w); }
.svact { display: flex; gap: 8px; }

.svact .primary { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.svact .primary svg, .lbtns svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.svact .svdel { flex: none; min-width: 48px; border-color: var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.svact .svdel svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.empty { align-items: center; text-align: center; padding: 34px 20px !important; gap: 12px !important; }

.sheet.leave { align-items: center; text-align: center; gap: 10px; }

.ltext { margin: 0; color: var(--muted); max-width: 320px; }
.lbtns { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.lbtns button { min-height: 54px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.lbtns button:not(.primary) { border-color: var(--line); }
.lbtns .primary { box-shadow: 0 12px 22px -14px var(--ink); }
.lbtns .ghostdanger { background: transparent; border-color: transparent; color: #d32f2f; }
:root[data-theme="dark"] .lbtns .ghostdanger { color: #ff8a8a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lbtns .ghostdanger { color: #ff8a8a; } }

/* ---- splash, transitions ---- */
#splash { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; transition: opacity 0.45s ease, transform 0.45s ease; }
#splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
#splash .sl { width: 132px; height: 132px; padding: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 38px; box-shadow: 0 24px 44px -22px rgba(20, 28, 60, 0.55); animation: slPop 0.6s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
#splash .sl line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: slDraw 0.45s ease-out forwards; }
#splash .sl rect { opacity: 0; animation: slFill 0.5s 1.05s ease-out forwards; }
#splash .sl circle { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: slDot 0.4s cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
#splash h1 { font-family: var(--font-body); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.03em; animation: rise 0.6s 0.9s ease-out both; }
#splash p { margin: 0; color: var(--muted); animation: rise 0.6s 1.05s ease-out both; }
#splash .sbar { width: 120px; height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden; margin-top: 10px; animation: rise 0.4s 0.9s ease-out both; }
#splash .sbar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); animation: slBar 1.1s 0.7s ease-in-out forwards; }
:root[dir="rtl"] #splash .sbar i { transform-origin: right; }
@keyframes slPop { from { opacity: 0; transform: scale(0.6) rotate(-6deg); } to { opacity: 1; transform: none; } }
@keyframes slDraw { to { stroke-dashoffset: 0; } }
@keyframes slFill { to { opacity: 0.2; } }
@keyframes slDot { to { transform: scale(1); } }
@keyframes slBar { to { transform: scaleX(1); } }
.screen.enter:not(.menu) { animation: slideIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
@keyframes slideIn { from { opacity: 0; transform: translateX(var(--dx, 0px)); } to { opacity: 1; transform: none; } }
.menu .logo { animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
}

/* ---- online ---- */
.menu .btns .net { background: var(--card); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px -16px var(--ink); }

#s-online .shead .iconbtn, #s-lobby .shead .iconbtn { align-self: center; background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 14px -8px rgba(20, 28, 60, 0.5); }

#s-online input[type="text"], #s-online input[type="url"] { font: 700 1.05rem var(--font-body); color: var(--ink); background: var(--paper); width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
#oCode { text-transform: uppercase; letter-spacing: 0.25em; text-align: center; direction: ltr; }
.orow { display: flex; gap: 8px; }
.orow input { flex: 1; }
.orow button { min-height: 48px; border-radius: 14px; }
#s-online .seg { background: var(--grid); padding: 4px; border-radius: 14px; gap: 4px; }

#s-online .card > .primary, #s-lobby > .primary { min-height: 54px; border-radius: 16px; }
.codecard { align-items: center; text-align: center; }
.bigcode { font: 800 2.6rem var(--font-body); letter-spacing: 0.22em; padding-inline-start: 0.22em; color: var(--ink); }
.lp { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.lp + .lp { border-top: 1px solid var(--line); }
.lp .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--paper); background: var(--pen); }
.lp.wait .av { background: var(--grid); color: var(--muted); }
.lp .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp.wait .nm { color: var(--muted); font-weight: 600; }
.lp .tag { margin-inline-start: auto; font-size: 0.72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--grid); color: var(--ink); }
.lp.wait .av::after { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.player .nm .you { font-size: 0.65rem; font-weight: 800; opacity: 0.7; margin-inline-start: 4px; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; max-width: min(88vw, 420px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 14px; font-weight: 700; text-align: center; box-shadow: 0 14px 28px -12px rgba(0, 0, 0, 0.5); animation: rise 0.25s ease-out both; }
.toast[hidden] { display: none; }
.lbtns button[hidden] { display: none; }

/* leave dialog */
.overlay { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; animation: rise 0.2s ease-out both; }
.dialog { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 18px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 12px; }

.dialog p { margin: 0; color: var(--muted); }
.dialog .seg { margin-top: 4px; flex-direction: column; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .confetti { display: none; }
}
</style>

  var ONLINE_URL = "https://dots-and-boxes-1c127-default-rtdb.europe-west1.firebasedatabase.app";   /* e.g. "https://your-project-default-rtdb.firebaseio.com" */
  var online = null, oCount = 2, qt = false, toastT = null, CODE_CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function dbUrl() {
    var u = ONLINE_URL; if (!u) { try { u = localStorage.getItem("dab-dburl") || ""; } catch (e) {} }
    return String(u).replace(/\/+$/, "");
  }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  function myPid() { var p = ls("dab-pid"); if (!p) { p = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); ls("dab-pid", p); } return p; }
  function toast(k, p) {
    var el = $("toast"); el.textContent = T(k, p); el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2800);
  }
  function rq(method, path, body) {
    var o = { method: method }; if (body !== undefined) o.body = JSON.stringify(body);
    return fetch(dbUrl() + "/rooms" + path + ".json", o).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); });
  }
  function storedRoom() {
    try { var o = JSON.parse(ls("dab-online") || "null"); if (o && /^[A-Z0-9]{5}$/.test(o.code) && o.pid === myPid()) return o; } catch (e) {}
    return null;
  }
  function myName() {
    var v = ($("oName").value || "").trim(); ls("dab-oname", v);
    return v || T("oGuest");
  }
  function renderOnline() {
    var ok = !!dbUrl();
    $("oSetup").hidden = ok; $("oMain").hidden = !ok;
    if (!ok) return;
    var nm = $("oName"); if (document.activeElement !== nm && !nm.value) nm.value = ls("dab-oname") || "";
    Array.prototype.forEach.call(document.querySelectorAll("#oCountSeg button"), function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-val") === oCount)); });
    var sum = [T(S.size === "s" ? "small" : S.size === "m" ? "sizeM" : "large") + " (" + T("boxesN", { n: build(S.size).cells.length }) + ")", S.extra ? T("sumExtra") : T("sumNoExtra")];
    if (S.timer !== "0") sum.push(T("sumTimer", { s: S.timer }));
    $("oSum").textContent = T("oSum", { s: sum.join(" · ") });
    var sr = storedRoom(); $("oRejoin").hidden = !sr;
    if (sr) $("oRejoinT").textContent = T("oRejoinT", { code: sr.code });
  }
  function genCode() { var c = ""; for (var i = 0; i < 5; i++) c += CODE_CH.charAt(Math.floor(Math.random() * CODE_CH.length)); return c; }
  function createRoom() {
    if (!dbUrl()) return;
    var pid = myPid(), name = myName(), tries = 0;
    var room = { v: 1, host: pid, n: oCount, size: S.size, extra: !!S.extra, timer: String(S.timer), status: "lobby", players: { 0: { id: pid, name: name } }, ts: Date.now() };
    (function attempt() {
      var code = genCode();
      rq("PUT", "/" + code, room).then(function () { enterRoom(code, 0); }).catch(function () {
        if (++tries < 4) attempt(); else toast("oErr");
      });
    })();
  }
  function joinRoom(raw) {
    if (!dbUrl()) return;
    var code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 5) { toast("oNoRoom"); return; }
    var pid = myPid(), name = myName();
    rq("GET", "/" + code).then(function (r) {
      if (!r || !r.players) { toast("oNoRoom"); return; }
      var i, n = +r.n || 2;
      for (i = 0; i < 4; i++) if (r.players[i] && r.players[i].id === pid) { enterRoom(code, i); return; }
      if (r.status !== "lobby") { toast("oStarted"); return; }
      (function tryslot(k) {
        while (k < n && r.players[k]) k++;
        if (k >= n) { toast("oFull"); return; }
        rq("PUT", "/" + code + "/players/" + k, { id: pid, name: name }).then(function () { enterRoom(code, k); }).catch(function () { r.players[k] = { id: "?" }; tryslot(k + 1); });
      })(0);
    }).catch(function () { toast("oErr"); });
  }
  function enterRoom(code, me) {
    exitOnline();
    online = { code: code, me: me, room: null, es: null, applied: 0, pending: false, sent: -1, started: false, timer: "0", host: false };
    ls("dab-online", JSON.stringify({ code: code, pid: myPid() }));
    openStream();
    show("lobby");
  }
  function exitOnline() {
    if (!online) return;
    try { if (online.es) online.es.close(); } catch (e) {}
    clearTimeout(online.pt); online = null;
  }
  function oApply(path, data) {
    if (path === "/" || path === "") { online.room = data == null ? null : data; return; }
    var ks = path.replace(/^\/+|\/+$/g, "").split("/"), o;
    if (!online.room || typeof online.room !== "object") online.room = {};
    o = online.room;
    for (var i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; }
    if (data === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = data;
  }
  function openStream() {
    var me = online, es;
    try { es = new EventSource(dbUrl() + "/rooms/" + me.code + ".json"); } catch (e) { toast("oErr"); return; }
    me.es = es;
    function handle(patch) {
      return function (ev) {
        if (online !== me) return;
        var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
        if (!d) return;
        if (patch) { var base = d.path === "/" ? "" : d.path; Object.keys(d.data || {}).forEach(function (k) { oApply(base + "/" + k, d.data[k]); }); }
        else oApply(d.path, d.data);
        onRoom();
      };
    }
    es.addEventListener("put", handle(false));
    es.addEventListener("patch", handle(true));
    es.addEventListener("open", function () { me.lost = false; });
    es.addEventListener("error", function () { if (online === me && !me.lost) { me.lost = true; toast("oConn"); } });
  }
  function slotOf(r, i) { return r && r.players && r.players[i] ? r.players[i] : null; }
  function onRoom() {
    var r = online && online.room;
    if (!online) return;
    if (!r || !r.players) { toast("oNoRoom"); ls("dab-online", null); playing = false; show("online"); return; }
    online.host = r.host === myPid();
    if ((r.status === "playing" || r.status === "over") && !online.started) startOnline();
    else if (screen === "lobby") renderLobby();
    if (online && online.started) syncMoves();
  }
  function renderLobby() {
    var r = online && online.room; if (!r) return;
    var n = +r.n || 2, h = "", cnt = 0, i;
    $("lCode").textContent = online.code;
    for (i = 0; i < n; i++) {
      var pl = slotOf(r, i);
      if (pl) cnt++;
      h += '<div class="lp' + (pl ? "" : " wait") + '" style="--pen:var(--pen' + i + ')"><span class="av">' + (pl ? esc(String(Array.from(String(pl.name || "?").trim())[0] || "?").toUpperCase()) : "") + '</span><span class="nm">' + (pl ? esc(String(pl.name || "")) : esc(T("oWaiting"))) + "</span>" +
           (pl && i === online.me ? '<span class="tag">' + esc(T("oYou")) + "</span>" : (pl && pl.id === r.host ? '<span class="tag">' + esc(T("oHost")) + "</span>" : "")) + "</div>";
    }
    $("lPlayers").innerHTML = h;
    $("lStart").hidden = !online.host; $("lStart").disabled = cnt < 2;
    $("lInfo").textContent = online.host ? (cnt < 2 ? T("oNeedTwo") : "") : T("oWaitHost");
  }
  function startRoom() {
    var r = online && online.room; if (!r || !online.host) return;
    var cnt = 0; for (var i = 0; i < 4; i++) if (slotOf(r, i)) cnt++;
    if (cnt < 2) return;
    $("lStart").disabled = true;
    var go = function () { return rq("PUT", "/" + online.code + "/status", "playing"); };
    (cnt !== +r.n ? rq("PUT", "/" + online.code + "/n", cnt).then(go) : go()).catch(function () { toast("oErr"); renderLobby(); });
  }
  function shareCode() {
    if (!online) return;
    var msg = T("title") + " — " + T("oCode") + ": " + online.code;
    if (navigator.share) { navigator.share({ text: msg }).catch(function () {}); return; }
    try { navigator.clipboard.writeText(online.code).then(function () { toast("oCopied"); }, function () {}); } catch (e) {}
  }
  function startOnline() {
    var r = online.room, i;
    n = Math.max(2, Math.min(4, +r.n || 2)); sizeKey = /^[sml]$/.test(r.size) ? r.size : "l"; B = build(sizeKey); gameExtra = r.extra !== false;
    online.timer = /^(0|15|30)$/.test(String(r.timer)) ? String(r.timer) : "0";
    clearTimeout(aiTimer); players = []; isCPU = [];
    for (i = 0; i < n; i++) { var pl = slotOf(r, i); players.push(String((pl && pl.name) || defName(i)).slice(0, 10)); isCPU.push(false); }
    inis = players.map(function (_, i) {
      var l = letter(i), same = 0; for (var j = 0; j < n; j++) if (letter(j) === l) same++;
      return same > 1 ? String(i + 1) : l;
    });
    online.started = true; online.applied = 0; online.pending = false; online.sent = -1;
    playing = true; renderRules(); resetGame(); show("game");
  }
  function syncMoves() {
    var r = online.room, mv = (r && r.moves) || {}, pend = 0, guard = 0;
    while (mv[online.applied + pend] != null) pend++;
    qt = pend > 1;
    while (mv[online.applied] != null && guard++ < 2000) {
      var m = mv[online.applied]; online.applied++;
      if (m && typeof m.e === "string" && B.edgeCells[m.e] && drawn[m.e] === undefined && +m.p === turn && !over) commit(m.e);
    }
    qt = false;
    if (online.pending && online.applied > online.sent) online.pending = false;
    if (over) ls("dab-online", null);
    renderGame();
  }
  function doCommit(e) { if (online) sendMove(e); else commit(e); }
  function sendMove(e) {
    var me = online;
    if (!me || me.pending || over || turn !== me.me || !B.edgeCells[e] || drawn[e] !== undefined) return;
    var idx = me.applied; me.pending = true; me.sent = idx; cand = null; renderGame();
    clearTimeout(me.pt);
    function recover() {
      if (online !== me) return;
      me.pending = false; renderGame();
      rq("GET", "/" + me.code).then(function (r) { if (online === me && r) { me.room = r; onRoom(); } }).catch(function () {});
    }
    rq("PUT", "/" + me.code + "/moves/" + idx, { e: e, p: me.me }).catch(function () { toast("oErr"); recover(); });
    me.pt = setTimeout(function () { if (online === me && me.pending && me.applied <= idx) { toast("oErr"); recover(); } }, 7000);
  }
  function openLeave() {
    $("leaveBox").querySelector('[data-act="saveleave"]').hidden = !!online;
    $("leaveBox").querySelector(".ltext").textContent = online ? T("oLeaveText") : T("leaveText");
    $("leaveBox").hidden = false;
  }

  /* ---------- actions ---------- */
  function inProgress() { return playing && !over && Object.keys(drawn).length > 0; }
  document.addEventListener("click", function (ev) {
    unlockAudio();
    var b = ev.target.closest("button"); if (!b || b.disabled) return;
    if (ev.detail === 0) tapFx(b);
    var tg = b.getAttribute("data-toggle");
    if (tg) { S[tg] = !S[tg]; saveS(); applyLang(); if (tg === "sound" || tg === "vib" || tg === "music") { snd.pick(); musSync(); } return; }
    var set = b.getAttribute("data-set");
    if (set) {
      var v = b.getAttribute("data-val");
      if (set === "lang") S.lang = v; else if (set === "theme") S.theme = v; else if (set === "size") S.size = v; else if (set === "level") S.level = v; else if (set === "timer") S.timer = v; else S[set] = v === "on";
      saveS(); applyLang();
      if (set === "sound" || set === "vib") snd.pick();
      return;
    }
    var a = b.getAttribute("data-act"); if (!a) return;
    if (a === "play") show("setup");
    else if (a === "online") show("online");
    else if (a === "ocount") { oCount = +b.getAttribute("data-val"); renderOnline(); }
    else if (a === "ocreate") createRoom();
    else if (a === "ojoin") joinRoom($("oCode").value);
    else if (a === "ostart") startRoom();
    else if (a === "oshare") shareCode();
    else if (a === "osaveurl") { var u = $("oUrl").value.trim(); if (/^https:\/\/[^\s]+$/.test(u)) { try { localStorage.setItem("dab-dburl", u); } catch (e) {} renderOnline(); } else toast("oErr"); }
    else if (a === "orejoin") { var sr = storedRoom(); if (sr) joinRoom(sr.code); }
    else if (a === "oforget") { try { localStorage.removeItem("dab-online"); } catch (e) {} renderOnline(); }
    else if (a === "how") show("how");
    else if (a === "settings") show("settings");
    else if (a === "menu") show("menu");
    else if (a === "count") { setupN = +b.getAttribute("data-val"); renderSetup(); }
    else if (a === "start") startGame();
    else if (a === "opts") openOptions();
    else if (a === "optsclose") closeOptions();
    else if (a === "again") { if (online) { playing = false; show("online"); } else resetGame(); }
    else if (a === "replay") replay();
    else if (a === "share") shareResult();
    else if (a === "confirm") { if (cand && !over && !isCPU[turn]) doCommit(cand); }
    else if (a === "kind") { kinds[+b.getAttribute("data-i")] = b.getAttribute("data-val"); S.kinds = kinds.join(""); saveS(); renderSetup(); }
    else if (a === "tomenu") { if (online ? !over : inProgress()) openLeave(); else { playing = false; show("menu"); } }
    else if (a === "keep") $("leaveBox").hidden = true;
    else if (a === "leave") { $("leaveBox").hidden = true; playing = false; if (!online) { try { localStorage.removeItem(AUTO_KEY); } catch (e) {} } show("menu"); }
    else if (a === "saveleave") { saveGame(); $("leaveBox").hidden = true; playing = false; show("menu"); }
    else if (a === "loadsave") show("saves");
    else if (a === "resume") loadGame(b.getAttribute("data-id"));
    else if (a === "delsave") {
      var id = b.getAttribute("data-id");
      if (pendingDel === id) { pendingDel = null; writeSaves(readSaves().filter(function (x) { return x.id !== id; })); updateSaveBadge(); renderSaves(); }
      else { pendingDel = id; renderSaves(); setTimeout(function () { if (pendingDel === id) { pendingDel = null; if (screen === "saves") renderSaves(); } }, 3000); }
    }
  });

  /* ---------- button press feedback ---------- */
  function tapFx(b, ev) {
    if (!b || b.disabled) return;
    var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
    var x = ev ? ev.clientX - r.left : r.width / 2, y = ev ? ev.clientY - r.top : r.height / 2;
    var rp = document.createElement("span"); rp.className = "ripple";
    rp.style.width = rp.style.height = d + "px"; rp.style.left = (x - d / 2) + "px"; rp.style.top = (y - d / 2) + "px";
    b.appendChild(rp);
    setTimeout(function () { if (rp.parentNode) rp.parentNode.removeChild(rp); }, 520);
    b.classList.remove("tap"); void b.offsetWidth; b.classList.add("tap");
    setTimeout(function () { b.classList.remove("tap"); }, 340);
  }
  document.addEventListener("pointerdown", function (ev) {
    var b = ev.target.closest && ev.target.closest("button"); if (b) { tapFx(b, ev); if (!b.disabled) snd.tick(); }
  });

  $("leaveBox").addEventListener("click", function (e) { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $("optsBox").addEventListener("click", function (e) { if (e.target === e.currentTarget) closeOptions(); });
  $("optsBox").querySelector(".sheet").addEventListener("transitionend", finishClosingOptions);
  applyLang();
  show("menu");
  (function () {
    var sp = $("splash"), done = false;
    function close() { if (done) return; done = true; sp.classList.add("out"); setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 520); }
    sp.addEventListener("pointerdown", close);
    setTimeout(close, 2300);
  })();
  musSync();
})();

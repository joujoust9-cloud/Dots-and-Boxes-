name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; else cp Dots-and-Boxes.html www/index.html; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dots and Boxes" com.dotsandboxes.game --web-dir www
          npx cap add android
          npx cap sync android

      - name: Use your icon (only if icon.png exists in the repo, 1024x1024)
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111827' || echo "icon step skipped"
          fi

      - name: Set portrait mode and vibration permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' "$MANIFEST"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.VIBRATE" />|' "$MANIFEST"
          cat "$MANIFEST"

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DotsAndBoxes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
